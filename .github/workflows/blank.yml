name: Fetch Cloudflare IPs & Update DNS

on:
  schedule:
    - cron: '0 */1 * * *'  # 每小时自动运行一次
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  process-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process CSV and Update Cloudflare DNS
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cat << 'EOF' > process.py
          import csv
          import json
          import os
          import urllib.request

          CSV_URL = "https://raw.githubusercontent.com/xgonce/Cloudflare_IP/refs/heads/main/result.csv"

          GROUPS = {
              "US": {
                  "country": "US",
                  "airports": ["SJC", "LAX"],
                  "file": "US.txt",
                  "domain": "us.bestcf.eu.cc"
              },
              "JP": {
                  "country": "JP",
                  "airports": ["NRT"],
                  "file": "JP.txt",
                  "domain": "jp.bestcf.eu.cc"
              },
              "HK": {
                  "country": "HK",
                  "airports": ["HKG"],
                  "file": "HK.txt",
                  "domain": "hk.bestcf.eu.cc"
              }
          }

          def is_ipv4(ip_str):
              return ":" not in ip_str and ip_str.count(".") == 3

          def fetch_filtered_data():
              req = urllib.request.Request(CSV_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  content = resp.read().decode('utf-8-sig', errors='ignore')

              lines = content.splitlines()
              reader = csv.DictReader(lines)
              
              if reader.fieldnames:
                  reader.fieldnames = [f.strip() for f in reader.fieldnames if f]

              valid_rows = []

              for row in reader:
                  ip = row.get("IP", "").strip()
                  cf_meta_ip = row.get("cf-meta-ip", "").strip()
                  port = row.get("端口", "").strip()
                  speed_str = row.get("速度(Mbps)", "0").strip()
                  country = row.get("CF归属国", "").strip()
                  datacenter = row.get("机房", "").strip()
                  tls_delay_str = row.get("TLS延迟(ms)", "999999").strip()

                  if not ip or ip != cf_meta_ip or not is_ipv4(ip):
                      continue

                  if port != "443":
                      continue

                  try:
                      speed = float(speed_str)
                  except ValueError:
                      speed = 0.0
                  if speed <= 5.00:
                      continue

                  try:
                      tls_delay = float(tls_delay_str)
                  except ValueError:
                      tls_delay = 999999.0

                  valid_rows.append({
                      "ip": ip,
                      "country": country,
                      "datacenter": datacenter,
                      "tls_delay": tls_delay
                  })
              return valid_rows

          def push_to_cloudflare(domain, ip_list):
              zone_id = os.environ.get("CF_ZONE_ID")
              api_token = os.environ.get("CF_API_TOKEN")

              if not zone_id or not api_token:
                  print(f"[跳过 CF 更新] 缺失 CF_ZONE_ID 或 CF_API_TOKEN 环境变量 ({domain})")
                  return

              if not ip_list:
                  print(f"[跳过 CF 更新] {domain} 无有效 IP，禁止提交空数据")
                  return

              headers = {
                  "Authorization": f"Bearer {api_token}",
                  "Content-Type": "application/json"
              }

              # 1. 查询该域名下现有的所有 TXT 记录
              url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={domain}&type=TXT"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      res_data = json.loads(response.read().decode('utf-8'))
                      existing_records = res_data.get("result", [])

                  # 2. 删除旧的 TXT 记录（清理无用或格式不符合的旧记录）
                  for rec in existing_records:
                      del_url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{rec['id']}"
                      del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                      with urllib.request.urlopen(del_req):
                          pass

                  # 3. 为每个 IP 创建独立的带引号 TXT 记录（规范化处理）
                  create_url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records"
                  for ip in ip_list:
                      payload = {
                          "type": "TXT",
                          "name": domain,
                          "content": f'"{ip}"',  # 加上显式双引号，满足 Cloudflare 规范
                          "ttl": 60
                      }
                      cr_req = urllib.request.Request(create_url, data=json.dumps(payload).encode('utf-8'), headers=headers, method="POST")
                      with urllib.request.urlopen(cr_req):
                          pass

                  print(f"成功为 {domain} 更新了 {len(ip_list)} 条标准的 DNS TXT 记录")

              except Exception as e:
                  print(f"[错误] Cloudflare API 更新失败 ({domain}): {e}")

          def main():
              rows = fetch_filtered_data()
              print(f"筛选到 {len(rows)} 条符合基础要求的节点")

              updated_count = 0

              for group_key, group_cfg in GROUPS.items():
                  country = group_cfg["country"]
                  airports = group_cfg["airports"]
                  file_path = group_cfg["file"]
                  domain = group_cfg["domain"]

                  matched = [r for r in rows if r["country"] == country and r["datacenter"] in airports]
                  matched.sort(key=lambda x: x["tls_delay"])

                  ip_list = [r["ip"] for r in matched]

                  if not ip_list:
                      print(f"[警告] 分组 {group_key} ({country}-{airports}) 当前无符合条件的 IP，跳过该分组")
                      continue

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("\n".join(ip_list) + "\n")
                  print(f"成功写入 {len(ip_list)} 个 IP 到 {file_path}")

                  if domain:
                      push_to_cloudflare(domain, ip_list)

                  updated_count += 1

              if updated_count == 0:
                  raise ValueError("所有分组均未提取到有效 IP，无法完成更新")

          if __name__ == "__main__":
              main()
          EOF

          python process.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt
          git diff --staged --quiet || (git commit -m "auto: update filtered Cloudflare IPs" && git push)
